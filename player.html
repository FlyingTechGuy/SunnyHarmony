<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
	<link rel="stylesheet" href="player.css">
	<link rel="shortcut icon" type="image/png" href="src/Sunny&HarmonyLogo.ico">
    <script src="https://kit.fontawesome.com/ceab6117ab.js" crossorigin="anonymous"></script>
    <!-- <script type="text/javascript" src="https://cdn.userway.org/widget.js"></script> -->
	<title>Sunny&Harmony - The Best Music App</title>
</head>
<body>
    <div class="bgGr"></div>
    <div class="blurSec">
        <div class="topCont">
            <div class="backBtnBox" id="backBtnBox">
                <i class="fa-solid fa-arrow-left"></i>
            </div>
            <div class="songNumBox">
                <p class="songNumTxt"><span id="songNumCur">1</span> of <span id="songNumTot">35</span></p>
            </div>
            <div class="plBtnBox" id="plBtnBox" title="Open Playlist (Shift + P)">
                <i class="fa-solid fa-list"></i>
            </div>
        </div>
        <div class="imgBoxBlur">
            <img src="" alt="" class="imgBlur" id="imgBlur">
        </div>
        <div class="imgBox">
            <img src="" alt="" class="imgCover" id="imgCover">
        </div>
        <div class="imgTxtBox">
            <p id="songName"></p><!--TENGO UN PLAN REMIX-->
            <p id="artistName"></p><!--KEY-KEY FT OZUNA-->
            <!-- <p id="genreTxt">Reggaeton</p> -->
        </div>
        <div class="fiveSecCont">
            <div class="forwardFiveBtn" id="forwardFiveBtn">
            </div>
            <div class="backwardFiveBtn" id="backwardFiveBtn">
            </div>
        </div>
    </div>
    <div class="bottomSec">
        <div class="kccBtnsBox">
            <p class="fiveSecTxt" id="fiveSecBackward"><i class="fa-solid fa-backward"></i> - 5</p>
            <div title="Toggle Karaoke (M)" id="kBtnBox"><i class="fa-solid fa-microphone"></i></div>
            <div title="Open CC (C)" id="ccBox"><i class="fa-solid fa-closed-captioning"></i></div>
            <p class="fiveSecTxt" id="fiveSecForward">+ 5 <i class="fa-solid fa-forward"></i></p>
        </div>
        <div class="sliderSec">
            <div class="sliderBox">
                <input type="range" min="0" max="100" value="0" id="duration_slider" class="diraction_slider">
            </div>
            <div class="curTimeBox">
                <p id="m">0</p><p style="padding-left: 0px; padding-right: 0px;">:</p><p id="s">00</p>
            </div>
            <div class="totTimeBox">
                <p id="totalTime">2:58</p>
            </div>
        </div>
        <div class="buttonsSec">
            <div title="Toggle Shuffle (S)" id="shBtnBox"><i class="fa-solid fa-shuffle"></i></div>
            <div id="prevBtnBox"><i class="fa-solid fa-backward-step"></i></div>
            <div id="playBtnBox">
                <i id="faPlay" class="fa-solid fa-play"></i>
                <i id="faPause" class="fa-solid fa-pause fahide"></i>
            </div>
            <div id="nextBtnBox"><i class="fa-solid fa-forward-step"></i></div>
            <div title="Toggle Auto Play (A)" id="apBtnBox" class="active"><i class="fa-solid fa-repeat"></i></div>
        </div>
    </div>
    <div class="plCont" id="plCont">
        <div class="plBox" id="plBox">
            <div class="plTopBox">
                <div class="plXBtn" id="plXBtn"><i class="fa-solid fa-xmark"></i></div>
                <div class="plGenreTxtBox">
                    <p class="plGenreTop">Current Playlist:</p>
                    <p class="plGenreTxt" id="genreTxt"></p><!--Reggaeton-->
                </div>
            </div>
            <div class="plSongsBox" id="plSongsBox"></div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</html>

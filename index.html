<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sunny&Harmony">
    <link rel="apple-touch-icon" href="src/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
	<link rel="stylesheet" href="style.css">
	<link rel="shortcut icon" type="image/png" href="src/Sunny&HarmonyLogo.ico">
    <script src="https://kit.fontawesome.com/ceab6117ab.js" crossorigin="anonymous"></script>
    <!-- <script type="text/javascript" src="https://cdn.userway.org/widget.js"></script> -->
	<title>Sunny&Harmony - The Best Music App</title>
</head>
<body>
    <div class="bodyCont">
        <div class="bgGr"></div>
        <p class="topTitle">Choose A Playlist</p>
        <div class="playlistsCont">
            <div class="playlistBox pl1" id="pl1">
                <p class="playlistBoxTitle">Reggaeton</p>
                <p class="playlistBoxSongNum"><span id="playlistNum1">35</span> Songs</p>
            </div>
            <div class="playlistBox pl2" id="pl2">
                <p class="playlistBoxTitle">Chill Vibes</p>
                <p class="playlistBoxSongNum"><span id="playlistNum2">35</span> Songs</p>
            </div>
            <div class="playlistBox pl3">
                <p class="playlistBoxTitle">Dancehall</p>
                <p class="playlistBoxSongNum"><span id="playlistNum3">35</span> Songs</p>
            </div>
            <div class="playlistBox pl4">
                <p class="playlistBoxTitle">Afro</p>
                <p class="playlistBoxSongNum"><span id="playlistNum4">35</span> Songs</p>
            </div>
            <div class="playlistBox pl5">
                <p class="playlistBoxTitle">Soca</p>
                <p class="playlistBoxSongNum"><span id="playlistNum5">35</span> Songs</p>
            </div>
            <div class="playlistBox pl6">
                <p class="playlistBoxTitle">Pop</p>
                <p class="playlistBoxSongNum"><span id="playlistNum6">35</span> Songs</p>
            </div>
        </div>
    </div>
    <script type="module">
        setTimeout(function() {
            document.querySelector("body").classList.add("show");
        }, 500);
        document.getElementById("pl1").addEventListener("click", function() {
            localStorage.setItem("~curGenre", "0");
            document.querySelector("body").style.opacity = 0;
            setTimeout(function(){
                window.location.replace("player.html");
            }, 250);
        });
        document.getElementById("pl2").addEventListener("click", function() {
            localStorage.setItem("~curGenre", "1");
            document.querySelector("body").style.opacity = 0;
            setTimeout(function(){
                window.location.replace("player.html");
            }, 250);
        });

        import { All_song } from './songsList.js';
        document.getElementById("playlistNum1").innerHTML = All_song[0].length;
        document.getElementById("playlistNum2").innerHTML = All_song[1].length;
    </script>
</html>
